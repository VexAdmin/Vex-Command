<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Vex Founder Console — Plantilla</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0e141b;
      --ink-2: #1c2733;
      --muted: #5b6b7c;
      --line: #d7dee7;
      --paper: #f3f6f9;
      --panel: #ffffff;
      --brand: #0b6e4f;
      --brand-deep: #084c37;
      --accent: #c45c26;
      --good: #0b6e4f;
      --warn: #b8860b;
      --bad: #b42318;
      --chip: #e8eef4;
      --shadow: 0 1px 0 rgba(14,20,27,.04), 0 12px 32px rgba(14,20,27,.06);
      --radius: 12px;
      --nav: 248px;
      --top: 56px;
      --font: "IBM Plex Sans", sans-serif;
      --display: "IBM Plex Serif", Georgia, serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(1200px 500px at 10% -10%, #dce8e2 0%, transparent 55%),
        radial-gradient(900px 400px at 100% 0%, #e7e0d6 0%, transparent 50%),
        var(--paper);
      letter-spacing: -0.01em;
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; }

    .app {
      display: grid;
      grid-template-columns: var(--nav) 1fr;
      min-height: 100vh;
    }

    /* Sidebar */
    .side {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 20px 14px;
      border-right: 1px solid var(--line);
      background: rgba(255,255,255,.72);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .brand {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 6px 10px 18px;
    }
    .brand-mark {
      font-family: var(--display);
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.03em;
    }
    .brand-sub {
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--muted);
      font-weight: 600;
    }
    .nav-section {
      margin: 10px 10px 4px;
      font-size: .68rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--ink-2);
      text-align: left;
      padding: 9px 12px;
      border-radius: 8px;
      font-weight: 500;
      font-size: .92rem;
      transition: background .15s ease, color .15s ease;
    }
    .nav-btn:hover { background: var(--chip); }
    .nav-btn.active {
      background: var(--ink);
      color: #fff;
    }
    .nav-btn .ico {
      width: 18px;
      text-align: center;
      font-family: var(--mono);
      font-size: .75rem;
      opacity: .7;
    }
    .side-foot {
      margin-top: auto;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      font-size: .8rem;
      color: var(--muted);
    }
    .side-foot strong { color: var(--ink); display: block; margin-bottom: 2px; }

    /* Main */
    .main { min-width: 0; }
    .topbar {
      height: var(--top);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.65);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .crumb { font-size: .85rem; color: var(--muted); }
    .crumb b { color: var(--ink); font-weight: 600; }
    .top-actions { display: flex; gap: 8px; align-items: center; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel);
      font-size: .78rem;
      font-weight: 500;
      color: var(--ink-2);
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--good);
      box-shadow: 0 0 0 3px rgba(11,110,79,.15);
    }
    .btn {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: .82rem;
      font-weight: 600;
    }
    .btn.primary {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }
    .btn.primary:hover { background: var(--brand-deep); }

    .content {
      padding: 24px 28px 48px;
      animation: fade .28s ease;
    }
    @keyframes fade {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }

    .hero-row {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      margin-bottom: 22px;
    }
    h1 {
      margin: 0;
      font-family: var(--display);
      font-size: 1.85rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }
    .lede {
      margin: 6px 0 0;
      color: var(--muted);
      max-width: 52ch;
      font-size: .95rem;
      line-height: 1.45;
    }

    .grid {
      display: grid;
      gap: 14px;
    }
    .g-4 { grid-template-columns: repeat(4, 1fr); }
    .g-3 { grid-template-columns: repeat(3, 1fr); }
    .g-2 { grid-template-columns: 1.4fr 1fr; }
    .g-2b { grid-template-columns: 1fr 1fr; }
    .span-2 { grid-column: span 2; }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px 18px;
      min-width: 0;
    }
    .card h3 {
      margin: 0 0 12px;
      font-size: .78rem;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .kpi {
      font-family: var(--display);
      font-size: 1.85rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .kpi-sub {
      margin-top: 8px;
      font-size: .82rem;
      color: var(--muted);
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .delta.up { color: var(--good); font-weight: 600; }
    .delta.down { color: var(--bad); font-weight: 600; }
    .delta.flat { color: var(--warn); font-weight: 600; }

    .bars {
      display: flex;
      align-items: end;
      gap: 6px;
      height: 120px;
      margin-top: 8px;
    }
    .bar {
      flex: 1;
      border-radius: 4px 4px 0 0;
      background: linear-gradient(180deg, #1a8f6a, #0b6e4f);
      opacity: .85;
      position: relative;
      min-width: 0;
      transition: opacity .15s;
    }
    .bar:hover { opacity: 1; }
    .bar.muted { background: #9aa8b5; opacity: .45; }
    .bar.neg { background: linear-gradient(180deg, #d6453a, #b42318); }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .86rem;
    }
    th {
      text-align: left;
      font-size: .72rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      padding: 0 8px 10px 0;
      border-bottom: 1px solid var(--line);
    }
    td {
      padding: 11px 8px 11px 0;
      border-bottom: 1px solid #eef2f6;
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: 0; }
    .mono { font-family: var(--mono); font-size: .8rem; }
    .tag {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: .72rem;
      font-weight: 600;
      background: var(--chip);
      color: var(--ink-2);
    }
    .tag.good { background: #e3f2ec; color: var(--good); }
    .tag.warn { background: #f7efd6; color: #8a6700; }
    .tag.bad { background: #f8e3e1; color: var(--bad); }
    .tag.plan { background: #e8eef4; }

    .list-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #eef2f6;
      font-size: .88rem;
    }
    .list-row:last-child { border-bottom: 0; }

    .kanban {
      display: grid;
      grid-template-columns: repeat(5, minmax(160px, 1fr));
      gap: 12px;
      overflow-x: auto;
    }
    .col {
      background: rgba(255,255,255,.55);
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      padding: 10px;
      min-height: 280px;
    }
    .col h4 {
      margin: 0 0 10px;
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }
    .deal {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      box-shadow: var(--shadow);
      animation: fade .35s ease;
    }
    .deal b { display: block; font-size: .88rem; margin-bottom: 4px; }
    .deal span { color: var(--muted); font-size: .78rem; }

    .progress {
      height: 8px;
      background: #e8eef4;
      border-radius: 99px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress > i {
      display: block;
      height: 100%;
      background: var(--brand);
      border-radius: 99px;
    }

    .alert {
      display: flex;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fffdf8;
      margin-bottom: 8px;
      font-size: .88rem;
    }
    .alert.crit { background: #fff7f6; border-color: #f0c9c5; }
    .alert .t { font-weight: 600; }

    .split {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 14px;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .filters input, .filters select {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      background: #fff;
      font: inherit;
      font-size: .85rem;
    }

    .hidden { display: none !important; }

    .banner {
      margin-bottom: 18px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #cfe0d8;
      background: linear-gradient(90deg, #eef7f3, #fff);
      font-size: .86rem;
      color: var(--ink-2);
    }
    .banner code {
      font-family: var(--mono);
      font-size: .78rem;
      background: #e8eef4;
      padding: 2px 6px;
      border-radius: 4px;
    }

    @media (max-width: 1100px) {
      .g-4 { grid-template-columns: repeat(2, 1fr); }
      .g-2, .g-2b, .g-3 { grid-template-columns: 1fr; }
      .span-2 { grid-column: auto; }
      .split { grid-template-columns: 1fr; }
    }
    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; }
      .side {
        position: relative;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .nav-scroll { display: flex; gap: 4px; overflow-x: auto; }
      .nav-btn { white-space: nowrap; }
      .side-foot { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <span class="brand-mark">Vex</span>
        <span class="brand-sub">Founder</span>
      </div>
      <div class="nav-section">Business</div>
      <div class="nav-scroll" id="nav"></div>
      <div class="side-foot">
        <strong>ops.vexraptor.com</strong>
        Plantilla demo · datos sintéticos @ 1.000 orgs
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="crumb">Founder Console / <b id="crumb">Command Center</b></div>
        <div class="top-actions">
          <span class="pill"><span class="dot"></span> Stripe live · ETL −4m</span>
          <span class="pill mono">FY2026 · USD</span>
          <button class="btn" type="button" onclick="exportToast()">Export CSV</button>
          <button class="btn primary" type="button" onclick="runBrief()">Weekly brief</button>
        </div>
      </header>
      <div class="content" id="view"></div>
    </div>
  </div>

  <script>
    const NAV = [
      { id: "command", label: "Command Center", ico: "01" },
      { id: "revenue", label: "Revenue", ico: "02" },
      { id: "customers", label: "Customers", ico: "03" },
      { id: "pipeline", label: "Pipeline", ico: "04" },
      { id: "usage", label: "Product Usage", ico: "05" },
      { id: "economics", label: "Unit Economics", ico: "06" },
      { id: "retention", label: "Retention", ico: "07" },
      { id: "support", label: "Support / VoC", ico: "08" },
      { id: "ops", label: "Platform Ops", ico: "09" },
      { id: "goals", label: "Goals & Alerts", ico: "10" },
      { id: "settings", label: "Settings", ico: "11" },
    ];

    const ORGS = [
      ["Educorporation", "Enterprise", 3625, 94, "ok"],
      ["NovaSec MSSP", "MSSP", 2100, 88, "ok"],
      ["Atlántica Bank Lab", "Professional", 1800, 71, "risk"],
      ["Meridian Pilot", "Essential", 650, 42, "risk"],
      ["Parabank LATAM", "Professional", 1500, 81, "ok"],
      ["Sense Partner BR", "MSSP", 2800, 90, "ok"],
      ["Harbor Fintech", "Enterprise", 4200, 77, "watch"],
      ["Andes Cyber", "Essential", 520, 35, "risk"],
    ];

    function money(n) {
      return new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 }).format(n);
    }

    function bars(values, opts = {}) {
      const max = Math.max(...values.map(Math.abs), 1);
      return `<div class="bars">${values.map((v, i) => {
        const h = Math.max(6, Math.round((Math.abs(v) / max) * 100));
        const cls = v < 0 ? "neg" : (opts.muteLast && i === values.length - 1 ? "muted" : "");
        return `<div class="bar ${cls}" style="height:${h}%" title="${v}"></div>`;
      }).join("")}</div>`;
    }

    const VIEWS = {
      command() {
        return `
          <div class="banner">Plantilla profesional del <b>Founder Console</b> — separado del Dashboard MSSP. Host objetivo: <code>ops.vexraptor.com</code>. Datos demo escalados a ~1.000 orgs.</div>
          <div class="hero-row">
            <div>
              <h1>Command Center</h1>
              <p class="lede">Una sola pantalla para saber si el negocio respira: dinero, logos, margen y salud de la máquina.</p>
            </div>
          </div>
          <div class="grid g-4">
            <div class="card"><h3>ARR</h3><div class="kpi">${money(4824000)}</div><div class="kpi-sub"><span class="delta up">↑ 12.4%</span> vs trimestre</div></div>
            <div class="card"><h3>MRR</h3><div class="kpi">${money(402000)}</div><div class="kpi-sub"><span class="delta up">↑ ${money(18400)}</span> net new</div></div>
            <div class="card"><h3>Paying logos</h3><div class="kpi">1,024</div><div class="kpi-sub"><span class="delta up">+37</span> este mes · 86 pilots</div></div>
            <div class="card"><h3>Gross margin</h3><div class="kpi">78%</div><div class="kpi-sub"><span class="delta flat">Gemini COGS 14%</span></div></div>
          </div>
          <div class="grid g-2" style="margin-top:14px">
            <div class="card">
              <h3>MRR trend (12 months)</h3>
              ${bars([210,230,245,260,275,290,310,330,350,365,385,402])}
            </div>
            <div class="card">
              <h3>Founder alerts</h3>
              <div class="alert crit"><div><div class="t">3 failed payments</div> ${money(5400)} MRR en dunning · acción hoy</div></div>
              <div class="alert"><div><div class="t">12 orgs health &lt; 45</div> Sin scan en 21+ días · riesgo de churn</div></div>
              <div class="alert"><div><div class="t">Gemini spike +38%</div> 24h · revisar scans Deep en 4 Enterprise</div></div>
              <div class="alert"><div><div class="t">Pipeline coverage 2.1×</div> Meta mes ${money(45000)} net new</div></div>
            </div>
          </div>
          <div class="grid g-3" style="margin-top:14px">
            <div class="card">
              <h3>Goal · Net new MRR</h3>
              <div class="kpi" style="font-size:1.4rem">${money(18400)} / ${money(25000)}</div>
              <div class="progress"><i style="width:74%"></i></div>
              <div class="kpi-sub">74% del mes</div>
            </div>
            <div class="card">
              <h3>NRR (trailing 90d)</h3>
              <div class="kpi">112%</div>
              <div class="kpi-sub"><span class="delta up">Expansion &gt; churn</span></div>
            </div>
            <div class="card">
              <h3>Platform health</h3>
              <div class="kpi">99.4%</div>
              <div class="kpi-sub">Uptime 30d · cola ARQ 12</div>
            </div>
          </div>`;
      },

      revenue() {
        return `
          <div class="hero-row"><div><h1>Revenue & Billing</h1><p class="lede">Waterfall, cohorts y facturación. Stripe es la fuente de verdad; los deals offline viven en ajustes manuales.</p></div></div>
          <div class="grid g-4">
            <div class="card"><h3>New</h3><div class="kpi" style="font-size:1.4rem">${money(22100)}</div></div>
            <div class="card"><h3>Expansion</h3><div class="kpi" style="font-size:1.4rem">${money(8600)}</div></div>
            <div class="card"><h3>Contraction</h3><div class="kpi" style="font-size:1.4rem">${money(3200)}</div></div>
            <div class="card"><h3>Churned MRR</h3><div class="kpi" style="font-size:1.4rem">${money(9100)}</div></div>
          </div>
          <div class="grid g-2" style="margin-top:14px">
            <div class="card span-2">
              <h3>MRR waterfall (this month)</h3>
              ${bars([402-18.4, 22.1, 8.6, -3.2, -9.1, 402], { muteLast: false })}
              <div class="kpi-sub">Start → New → Expansion → Contraction → Churn → End</div>
            </div>
            <div class="card">
              <h3>By plan</h3>
              <div class="list-row"><span>Essential</span><b>${money(62000)}</b></div>
              <div class="list-row"><span>Professional</span><b>${money(148000)}</b></div>
              <div class="list-row"><span>Enterprise</span><b>${money(129000)}</b></div>
              <div class="list-row"><span>MSSP Partner</span><b>${money(63000)}</b></div>
            </div>
            <div class="card">
              <h3>Billing health</h3>
              <div class="list-row"><span>Open invoices</span><b>41</b></div>
              <div class="list-row"><span>Past due</span><b class="delta down">7</b></div>
              <div class="list-row"><span>Dunning active</span><b>3</b></div>
              <div class="list-row"><span>Refunds 30d</span><b>${money(1200)}</b></div>
            </div>
          </div>
          <div class="card" style="margin-top:14px">
            <h3>Revenue retention cohorts (logo $ retained)</h3>
            <table>
              <thead><tr><th>Cohort</th><th>M0</th><th>M1</th><th>M2</th><th>M3</th><th>M6</th></tr></thead>
              <tbody>
                <tr><td>2026-03</td><td>100%</td><td>98%</td><td>101%</td><td>108%</td><td>114%</td></tr>
                <tr><td>2026-04</td><td>100%</td><td>97%</td><td>99%</td><td>105%</td><td>—</td></tr>
                <tr><td>2026-05</td><td>100%</td><td>96%</td><td>102%</td><td>—</td><td>—</td></tr>
                <tr><td>2026-06</td><td>100%</td><td>99%</td><td>—</td><td>—</td><td>—</td></tr>
              </tbody>
            </table>
          </div>`;
      },

      customers() {
        const rows = ORGS.map(([n,p,m,h,r]) => `
          <tr>
            <td><b>${n}</b></td>
            <td><span class="tag plan">${p}</span></td>
            <td class="mono">${money(m)}</td>
            <td>
              <div class="progress" style="width:90px;display:inline-block;vertical-align:middle"><i style="width:${h}%;background:${h<50?"var(--bad)":h<75?"var(--warn)":"var(--good)"}"></i></div>
              <span class="mono">${h}</span>
            </td>
            <td><span class="tag ${r==="ok"?"good":r==="risk"?"bad":"warn"}">${r}</span></td>
            <td class="mono">2d ago</td>
          </tr>`).join("");
        return `
          <div class="hero-row"><div><h1>Customers</h1><p class="lede">Account 360° a escala 1.000: plan, MRR, health y riesgo — sin findings del tenant.</p></div></div>
          <div class="filters">
            <input placeholder="Buscar org…" style="min-width:220px" />
            <select><option>All plans</option><option>Essential</option><option>Professional</option><option>Enterprise</option><option>MSSP</option></select>
            <select><option>All health</option><option>Risk only</option><option>Watch</option></select>
            <select><option>Sort: MRR ↓</option><option>Health ↑</option><option>Last active</option></select>
          </div>
          <div class="card">
            <table>
